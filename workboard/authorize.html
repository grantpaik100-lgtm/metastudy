<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI 연결 승인 · StudyMeta</title><link rel="stylesheet" href="/account.css"></head><body><main><section class="card"><div class="eyebrow">STUDYMETA / CONNECT</div><h1>AI와 작업판 연결</h1><p id="description">연결 요청을 확인하고 있어요.</p><div id="details" hidden><h2 id="client"></h2><p id="user"></p><p id="scope"></p><p>연결하면 이 AI 앱이 본인 권한으로 공동 작업판에 접근합니다. 변경 기록에는 본인 이름과 AI 표시가 함께 남아요.</p><small>연결을 마친 뒤 돌아갈 주소</small><code id="redirect"></code><div class="row"><button id="approve" class="primary">접근 승인</button><button id="deny">거절</button></div></div><div id="status" class="status" role="status"></div></section></main>
<script type="module">
const $=s=>document.querySelector(s),input=Object.fromEntries(new URLSearchParams(location.search));
try{const response=await fetch('/api/oauth/request?'+new URLSearchParams(input));const data=await response.json();if(response.status===401)location.replace('/login.html?next='+encodeURIComponent(location.pathname+location.search));else if(data.error==='password_change_required')location.replace('/account.html?first=1&next='+encodeURIComponent(location.pathname+location.search));else if(!response.ok)throw new Error(data.message);else{$('#description').textContent='아래 앱과 접근 범위를 확인해주세요.';$('#client').textContent=data.client.name;$('#user').textContent=data.user.name+' 계정으로 연결합니다.';$('#scope').textContent='접근 범위: '+(data.scope.includes('workboard:write')?'작업판 조회 및 수정':'작업판 조회');$('#redirect').textContent=data.redirectUri;$('#details').hidden=false;}}catch(error){$('#status').textContent=error.message;}
for(const id of ['approve','deny'])$('#'+id).onclick=async()=>{$('#approve').disabled=$('#deny').disabled=true;try{const response=await fetch('/api/oauth/consent',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...input,approve:id==='approve'})});const data=await response.json();if(!response.ok)throw new Error(data.message);location.assign(data.redirect_url);}catch(error){$('#status').textContent=error.message;$('#approve').disabled=$('#deny').disabled=false;}};
</script></body></html>
