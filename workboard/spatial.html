<style>

*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 11px}button:hover{background:var(--surface-soft);border-color:var(--line-strong)}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:3px solid var(--blue-line);outline-offset:2px}input,select,textarea{width:100%;min-width:0;border:1px solid var(--line-strong);border-radius:7px;padding:8px;background:var(--surface)}textarea{resize:vertical;line-height:1.6}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}h1,h2,h3,p{margin:0}h1{font-size:19px;letter-spacing:-.5px}h2{font-size:18px}small,.muted{color:var(--muted)}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;background:var(--surface);border-bottom:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center}.mark{background:var(--blue);color:white;border-radius:11px;font-size:26px;width:42px;height:42px;text-align:center}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:700}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:11px}.badge:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}.workspace{display:grid;grid-template-columns:204px minmax(0,1fr) 304px;min-height:calc(100vh - 80px)}.rail{padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);min-width:0}.rail-title{display:flex;justify-content:space-between;margin-bottom:14px;font-weight:600;font-size:12px}.rail input{font-size:12px;margin-bottom:14px}.feature{display:flex;align-items:center;width:100%;border:0;background:none;text-align:left;padding:9px 10px;margin-bottom:3px;font-size:12px;gap:8px}.feature small{margin-left:auto;font-size:10px}.feature[aria-pressed=true]{background:var(--blue-soft);color:var(--blue)}.feature[aria-pressed=true] small{color:var(--blue)}.feature:before{content:'◇';font-size:15px}.mini-heading{font-size:10px;letter-spacing:1px;margin:25px 9px 10px;color:var(--muted)}.rail-note{font-size:11px;line-height:1.7;padding:13px 9px;color:var(--muted);border-top:1px solid var(--line);margin-top:18px}.node-list{max-height:35vh;overflow:auto}.node-list button{display:block;border:0;text-align:left;width:100%;font-size:11px;background:transparent;padding:7px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.node-list button[aria-pressed=true]{color:var(--blue);background:var(--blue-soft)}.node-list details summary{cursor:pointer;padding:6px 8px;font-size:11px;color:var(--muted)}.stage-column{min-width:0;display:flex;flex-direction:column}.view-head{padding:20px 22px 12px;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}.view-head h2{font-size:21px;letter-spacing:-.6px}.view-head p{font-size:11px;color:var(--muted);margin-top:4px}.segmented{display:flex;gap:3px;border:1px solid var(--line);padding:3px;border-radius:10px;background:var(--surface)}.segmented button{font-size:11px;border:0;background:none}.segmented button[aria-pressed=true]{background:var(--text);color:white}.stage{position:relative;min-height:480px;flex:1;isolation:isolate;overflow:hidden}.stage canvas{display:block;width:100%;height:100%;position:absolute;inset:0;touch-action:none}.legend{position:absolute;top:12px;left:22px;display:flex;gap:13px;font-size:10px;pointer-events:none;z-index:1}.legend span{display:flex;gap:5px;align-items:center}.dot{width:6px;height:6px;border-radius:50%;display:inline-block}.stage-controls{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:5px;background:var(--surface);border:1px solid var(--line);padding:5px;border-radius:11px;box-shadow:var(--shadow);white-space:nowrap}.stage-controls button{border:0;padding:5px 9px;font-size:12px}.stage-controls [aria-pressed=true]{background:var(--blue-soft);color:var(--blue)}.stage-help{position:absolute;bottom:67px;left:22px;color:var(--muted);font-size:10px;pointer-events:none}.timeline{border-top:1px solid var(--line);padding:14px 22px 18px;background:var(--surface)}.timeline-top{display:flex;justify-content:space-between;align-items:center;font-size:11px}.timeline label{display:flex;gap:8px;align-items:center}.timeline input[type=range]{padding:0;border:0;margin:10px 0;accent-color:var(--blue)}.time-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.inspector{background:var(--surface);border-left:1px solid var(--line);padding:20px 18px;min-width:0;max-height:calc(100vh - 80px);overflow:auto}.inspector .section-kicker{font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:10px}.inspector h2{margin-bottom:8px;overflow-wrap:anywhere}.inspector .description{font-size:12px;color:var(--muted);line-height:1.8;white-space:pre-wrap}.field{display:block;font-size:11px;font-weight:600;margin-top:13px}.field>span{display:block;margin-bottom:5px}.field input,.field select,.field textarea{font-weight:400;font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save-row{display:flex;gap:6px;margin:16px 0}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.primary:hover{background:var(--blue-dark);color:#fff}.meta{font-size:10px;color:var(--muted);line-height:1.8;overflow-wrap:anywhere}.relations{border-top:1px solid var(--line);padding-top:14px;margin-top:20px}.relation{width:100%;text-align:left;font-size:11px;display:block;margin:5px 0;padding:9px}.relation small{display:block;font-size:10px}.link-source{display:block;overflow-wrap:anywhere;font-size:11px;margin:5px 0}.empty-inspector{padding:26px 3px}.empty-symbol{font-size:40px;color:var(--blue-line);margin:20px 0}.empty-inspector p{font-size:12px;color:var(--muted);line-height:1.8;margin:10px 0}.count-line{font-size:11px;color:var(--muted);margin-top:20px}.note{background:var(--amber-soft);color:var(--amber);font-size:11px;padding:10px;border-radius:8px;margin:10px 0;line-height:1.7}.hint-list{display:grid;gap:10px;margin:20px 0;font-size:12px}.history{font-size:11px;margin-top:15px}.history summary{cursor:pointer}.history article{border-left:2px solid var(--line);padding:8px 10px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.history small{display:block}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:white;padding:10px 18px;border-radius:10px;z-index:10;max-width:90vw;font-size:12px}.toast:empty{display:none}.screen-preview{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden;background:#fff}.screen-preview svg{display:block;width:100%;max-height:390px}.screen-preview summary{padding:9px;font-size:11px;cursor:pointer}.embed .top{padding:12px 18px}.embed .workspace{min-height:680px;grid-template-columns:165px minmax(0,1fr) 270px}.embed .inspector{max-height:820px}.embed .top .back{display:none}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:1200px){.workspace{grid-template-columns:175px minmax(0,1fr) 275px}.top{padding:14px 18px}.legend{gap:8px}.embed .workspace{grid-template-columns:140px minmax(0,1fr) 250px}}
@media(max-width:960px){.workspace,.embed .workspace{grid-template-columns:160px minmax(0,1fr)}.inspector{grid-column:1/-1;border-top:1px solid var(--line);max-height:none;display:block}.stage{min-height:530px}.top-actions .back{display:none}.rail{grid-row:1}.inspector form{max-width:720px;margin:auto}.empty-inspector{padding:5px}.empty-symbol{display:none}.top{flex-wrap:wrap}.node-list{max-height:280px}}
@media(max-width:600px){.workspace,.embed .workspace{display:block}.top{padding:12px}.top-actions{gap:5px}.top-actions button{font-size:11px}.rail{padding:12px;border-bottom:1px solid var(--line);border-right:0}.rail-title,.rail-note,.mini-heading,.node-list{display:none}.rail input{margin-bottom:8px}.features{display:flex;flex-wrap:wrap;gap:2px}.feature{width:auto;font-size:11px;padding:6px 8px}.feature small{display:none}.feature:before{display:none}.stage{min-height:470px}.view-head{padding:16px 14px 8px}.view-head h2{font-size:18px}.legend{left:14px}.stage-help{left:14px;max-width:80%}.timeline{padding:12px 14px}.inspector{padding:18px}.top h1{font-size:17px}.badge{font-size:10px}.mark{width:36px;height:36px;font-size:23px}.time-labels{font-size:9px}.stage-controls button{min-height:35px}.segmented button{padding:7px 9px}.two input{font-size:14px}input,select,textarea{font-size:16px}}

</style></head>
<body>
<header class="top"><div class="brand"><div class="mark" aria-hidden="true">◇</div><div><div class="eyebrow">STUDYMETA / WORKBOARD</div><h1>3D 구조 지도</h1></div></div><div class="top-actions"><span class="badge" id="connection" role="status">연결 중</span><a class="back" href="./#spatial">작업판으로 ↗</a><button id="add-node">＋ 노드</button><button id="add-edge">＋ 연결</button><button id="export">내보내기 ↗</button></div></header>
<div class="workspace"><aside class="rail" aria-label="기능 위계"><div class="rail-title">기능 구조 <span class="muted">01—07</span></div><label><span class="sr-only">노드·연결 검색</span><input id="search" placeholder="기능·도구·담당자 검색"></label><div class="features" id="features"></div><details id="element-tree" open style="margin-top:18px"><summary style="font-size:11px;cursor:pointer;color:var(--muted)">세부 항목 목록</summary><div id="node-list" class="node-list"></div></details><p class="rail-note">9월 작업판 + 10월 수정 PR의 연결 초안입니다.<br>담당·최초 기획일·운영일은 확인된 경우에만 입력합니다.</p></aside>
<section class="stage-column" aria-label="네 면과 연결"><header class="view-head"><div><h2 id="feature-title">계획·자료</h2><p id="visible-count">구조를 불러오고 있어요</p></div><div class="segmented"><button id="view-3d" aria-pressed="true">3D</button><button id="view-flat" aria-pressed="false">펼쳐 보기</button></div></header>
<div class="stage" id="stage"><div class="legend"><span><i class="dot" style="background:#7760b5"></i>기획</span><span><i class="dot" style="background:#2563eb"></i>UI·UX</span><span><i class="dot" style="background:#168f86"></i>MCP</span><span><i class="dot" style="background:#b87c36"></i>백엔드</span></div><canvas id="scene" tabindex="0" aria-label="네 면의 노드와 연결선. 드래그로 회전, 휠로 확대. 왼쪽 항목 목록으로 키보드 선택도 가능합니다."></canvas><div class="stage-help" id="stage-help">빈 곳 드래그: 회전 · Shift 드래그: 이동 · 휠: 확대 · 노드/선: 상세</div><div class="stage-controls"><button id="rotate-left" aria-label="왼쪽 회전">↶</button><button id="rotate-right" aria-label="오른쪽 회전">↷</button><button id="zoom-out" aria-label="축소">−</button><button id="zoom-in" aria-label="확대">＋</button><button id="fit">전체 맞춤</button><button id="move-mode" aria-pressed="false">배치</button><button id="clear">선택 해제</button></div></div>
<footer class="timeline"><div class="timeline-top"><label for="time">확인된 추가일 기준 <strong id="time-value">전체 시점</strong></label><span id="unknown-date">날짜 미확인 포함</span></div><input id="time" type="range" min="0" max="3" value="3" step="1" aria-label="추가 시점 필터"><div class="time-labels"><span>09.27 와이어프레임</span><span>09.28 파일럿</span><span>10.17 피드백 수정</span><span>전체</span></div></footer></section>
<aside id="inspector" class="inspector" aria-label="선택 항목 상세"></aside></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module">
import {normalizeBoard,applyOp} from './board-ops.js';
import {PLANES,STATES} from './spatial-ops.js';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const planeNames={idea:'기획·아이디어',ux:'채팅 UI·UX',mcp:'MCP',backend:'백엔드'};
const colors={idea:'#7760b5',ux:'#2563eb',mcp:'#168f86',backend:'#b87c36'};
const days=['2026-09-27','2026-09-28','2026-10-17',''];
if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');
if(innerWidth<600){$('element-tree').open=false;$('node-list').style.display='block';}
let board,revision=-1,selected=null,feature='계획·자료',search='',mode='3d',moveMode=false,filterDate='',hits=[],edgeHits=[],positions=new Map(),saveBusy=false,framePending=false;
let camera={yaw:-.24,pitch:.14,zoom:1,panX:0,panY:0};
let editorVersion=0,editorBaseline={},dirty=false,drag=null,transient=new Map(),toastTimer;
const client=crypto.randomUUID(), canvas=$('scene'), ctx=canvas.getContext('2d');
let username;try{username=localStorage.getItem('workboard-collab-name')||'이름 미설정';}catch{username='이름 미설정';}
const graph=()=>board?.spatial||{nodes:[],edges:[]};
const all=()=>[...graph().nodes,...graph().edges];
const find=id=>all().find(n=>n.id===id);
function toast(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',6000);}
function syncStatus(text){$('connection').textContent=text;}
function featureNames(){return [...new Set(graph().nodes.map(n=>n.feature))];}
function isNode(n){return 'plane' in n;}
function ageVisible(n){return !filterDate||!n.introduced||n.introduced<=filterDate;}
function trace(){
 const ids=new Set();if(!selected)return ids;const start=find(selected);if(!start)return ids;ids.add(selected);
 function walk(id,direction,depth,seen=new Set()){if(depth>6||seen.has(id))return;seen.add(id);ids.add(id);for(const e of graph().edges){if(!ageVisible(e))continue;const match=direction==='up'?e.to===id:e.from===id;if(match){ids.add(e.id);walk(direction==='up'?e.from:e.to,direction,depth+1,seen);}}}
 if(isNode(start)){walk(start.id,'up',0);walk(start.id,'down',0);}else{walk(start.from,'up',0);walk(start.to,'down',0);}return ids;
}
function visible(){
 const traced=trace();let nodes=graph().nodes.filter(n=>ageVisible(n)&&(!feature||n.feature===feature||traced.has(n.id)));
 if(search){const matching=new Set(all().filter(n=>[n.title,n.description,n.owner,n.followup,n.source].join(' ').toLowerCase().includes(search)).map(n=>n.id));for(const e of graph().edges)if(matching.has(e.id)){matching.add(e.from);matching.add(e.to);}nodes=nodes.filter(n=>matching.has(n.id));}
 const ids=new Set(nodes.map(n=>n.id));return {nodes,edges:graph().edges.filter(e=>ids.has(e.from)&&ids.has(e.to)&&ageVisible(e))};
}
function sidebar(){
 const names=featureNames();$('features').innerHTML=[['','전체 구조'],...names.map(n=>[n,n])].map(([v,title])=>`<button class="feature" data-feature="${esc(v)}" aria-pressed="${feature===v}">${esc(title)}<small>${graph().nodes.filter(n=>!v||n.feature===v).length}</small></button>`).join('');
 const {nodes,edges}=visible();$('feature-title').textContent=feature||'전체 기능 구조';$('visible-count').textContent=`${nodes.length}개 노드 · ${edges.length}개 연결 · 네 면의 대응 관계`;
 $('node-list').innerHTML=PLANES.map(p=>`<details open><summary>${planeNames[p]}</summary>${nodes.filter(n=>n.plane===p).map(n=>`<button data-select="${esc(n.id)}" aria-pressed="${selected===n.id}">${n.parentId?'↳ ':''}${esc(n.title)}</button>`).join('')}</details>`).join('')+`<details><summary>연결선 ${edges.length}개</summary>${edges.map(e=>`<button data-select="${esc(e.id)}" aria-pressed="${selected===e.id}">${esc(e.title)} · ${esc(find(e.from)?.title||'')}</button>`).join('')}</details>`;
 $('unknown-date').textContent=`날짜 미확인 ${nodes.filter(n=>!n.introduced).length}개 포함`;
}
function renderAll(preserveEditor=false){sidebar();drawSoon();if(!preserveEditor)inspector();}
function choose(id){if(dirty&&!confirm('저장하지 않은 편집이 있어요. 항목을 바꾸고 편집을 취소할까요?'))return;selected=id;dirty=false;renderAll();}
function input(label,name,value='',type='text'){return `<label class="field"><span>${label}</span><input type="${type}" name="${name}" value="${esc(value)}" ${name==='title'?'required maxlength="200"':''}></label>`;}
function area(label,name,value,rows=3){return `<label class="field"><span>${label}</span><textarea name="${name}" rows="${rows}">${esc(value)}</textarea></label>`;}
function selectField(label,name,value,options){return `<label class="field"><span>${label}</span><select name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;}
function sources(s){return String(s||'').split('\n').filter(Boolean).map(line=>/^https?:\/\//.test(line.trim())?`<a class="link-source" href="${esc(line.trim())}" target="_blank" rel="noopener noreferrer">근거 문서 ↗</a>`:`<div class="meta">${esc(line)}</div>`).join('');}
function preview(n){const screen=board.screens.find(s=>'ux-'+s.id===n.id);if(!screen?.drawing?.shapes)return '';const shapes=screen.drawing.shapes;const height=Math.max(650,...shapes.map(s=>(Number(s.y)||0)+(Number(s.h)||0)+20));const palette={accent:'#d7f4f1',soft:'#f1f4f7',dark:'#29384b',line:'#fff'};const svg=shapes.map(s=>{const x=Number(s.x)||0,y=Number(s.y)||0,w=Number(s.w)||0,h=Number(s.h)||0;const textColor=s.tone==='dark'?'#fff':'#29384b';let shape=s.type==='rect'?`<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" rx="${s.round?7:0}" fill="${palette[s.tone]||'#fff'}" stroke="#d9e3e6"/>`:s.type==='ellipse'?`<ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${Math.abs(w/2)}" ry="${Math.abs(h/2)}" fill="#eff6ff" stroke="#a9b8c8"/>`:['line','arrow'].includes(s.type)?`<path d="M ${x} ${y} l ${w} ${h}" stroke="#8da2b5" fill="none"/>`:'';if(s.text)shape+=`<text x="${x+4}" y="${y+(s.type==='text'?16:h/2+5)}" font-size="${s.size==='s'?11:s.size==='l'?17:14}" fill="${textColor}">${esc(s.text)}</text>`;return shape;}).join('');return `<details class="screen-preview"><summary>원본 와이어프레임 보기</summary><svg viewBox="0 0 375 ${height}" role="img" aria-label="${esc(screen.title)}">${svg}</svg></details>`;}
function inspector(){
 const n=find(selected);if(!n){$('inspector').innerHTML=`<div class="empty-inspector"><div class="section-kicker">CONNECTION ATLAS</div><div class="empty-symbol">◇ ⤳ ◇</div><h2>하나를 고르면<br>연결이 보입니다.</h2><p>노드나 선을 선택해 기획부터 구현까지 따라가 보세요. 연결선에도 담당자와 후속 과제를 남길 수 있어요.</p><div class="hint-list"><span>01　면은 서로 다른 관점</span><span>02　노드는 기능과 구현 요소</span><span>03　선은 둘 사이의 관계</span></div><p>날짜 필터는 확인된 추가 시점으로 거릅니다. 과거 내용 전체를 복원하는 타임머신은 아직 아닙니다.</p><div class="note">기능 연결은 검토 초안입니다. 운영 반영 여부·미확인 담당자는 비워 두었습니다.</div><label class="field"><span>편집자 표시 이름</span><input id="username" value="${esc(username)}" maxlength="20"></label><button id="set-name" style="margin-top:8px">이름 적용</button><div class="count-line">${graph().nodes.length}개 노드 / ${graph().edges.length}개 연결<br>공유 서버 저장 · 같은 서버에 연결된 창 간 동기화</div></div>`;return;}
 const node=isNode(n);editorVersion=n.version;editorBaseline=structuredClone(n);dirty=false;
 const relation=graph().edges.filter(e=>e.from===n.id||e.to===n.id);

async function operation(op){
 const response=await fetch('/api/op',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client,op}),signal:AbortSignal.timeout(10000)});const data=await response.json();if(!response.ok)throw new Error(data.message||'저장 결과를 확인할 수 없어요.');await reload();return data;
}
async function saveEdit(e){e.preventDefault();if(saveBusy)return;const values=Object.fromEntries(new FormData(e.target));const fields=Object.fromEntries(Object.entries(values).filter(([k,v])=>v!==(editorBaseline[k]||'')));if(!Object.keys(fields).length){toast('변경된 내용이 없어요.');return;}saveBusy=true;$('save').disabled=true;try{await operation({type:`spatial.${isNode(editorBaseline)?'node':'edge'}.update`,id:selected,expectedVersion:editorVersion,fields});dirty=false;inspector();toast('서버에 저장했습니다.');}catch(error){toast(error.message);await reload();}finally{saveBusy=false;if($('save'))$('save').disabled=false;}}
function newItem(kind){if(dirty&&!confirm('저장하지 않은 편집을 취소하고 새 항목을 만들까요?'))return;selected=null;dirty=false;const featureOptions=featureNames().map(n=>[n,n]);const nodeOptions=graph().nodes.map(n=>[n.id,planeNames[n.plane]+' · '+n.title]);$('inspector').innerHTML=`<div class="section-kicker">CREATE / ${kind==='node'?'NODE':'RELATION'}</div><h2>${kind==='node'?'새 노드':'새 연결선'}</h2><form id="new-form">${input('이름','title')}${kind==='node'?selectField('면','plane','idea',PLANES.map(p=>[p,planeNames[p]])):selectField('출발 노드','from',nodeOptions[0]?.[0],nodeOptions)+selectField('도착 노드','to',nodeOptions[1]?.[0],nodeOptions)}${selectField('기능 영역','feature',feature||featureNames()[0],featureOptions)}${area('내용과 의미','description','')}${input('담당자','owner')}${area('후속으로 생각할 것','followup','')}<div class="save-row"><button type="submit" class="primary">${kind==='node'?'노드 만들기':'연결 만들기'}</button><button type="button" id="cancel-create">취소</button></div></form>`;$('new-form').addEventListener('submit',async e=>{e.preventDefault();if(saveBusy)return;saveBusy=true;const submit=e.submitter;submit.disabled=true;const item={...Object.fromEntries(new FormData(e.target)),id:crypto.randomUUID(),status:'기획',introduced:new Date().toLocaleDateString('en-CA'),planned:'',implemented:'',deployed:'',source:'작업판에서 직접 추가',parentId:''};try{await operation({type:`spatial.${kind}.create`,item});feature=item.feature;choose(item.id);toast('새 항목을 저장했습니다.');}catch(err){toast(err.message);}finally{saveBusy=false;submit.disabled=false;}});}
function receive(next,rev){const normalized=normalizeBoard(next);if(!normalized){toast('서버의 작업판 형식을 확인해주세요.');return;}board=normalized;revision=rev;if(feature&&!featureNames().includes(feature))feature='';const n=find(selected);const preserve=!!$('new-form')||dirty||saveBusy;renderAll(preserve);if(preserve&&n&&n.version!==editorVersion&&$('edit-notice')){const notice=$('edit-notice');notice.hidden=false;notice.textContent='서버에 새 변경이 있습니다. 현재 편집은 남아 있어요. 저장 전 최신 내용을 확인해주세요.';}}
async function reload(){const response=await fetch('/api/state',{signal:AbortSignal.timeout(10000)});if(!response.ok)throw new Error('서버에 연결하지 못했어요.');const data=await response.json();receive(data.board,data.rev);}
const events=new EventSource(`/api/events?client=${client}&name=${encodeURIComponent(username)}&color=${encodeURIComponent('#2563eb')}`);
events.addEventListener('hello',e=>{const data=JSON.parse(e.data);receive(data.board,data.rev);syncStatus('서버 연결됨');});
events.addEventListener('op',e=>{const data=JSON.parse(e.data);if(data.rev<=revision)return;if(data.rev!==revision+1){reload().catch(()=>syncStatus('다시 연결 중'));return;}const result=applyOp(board,data.op,{trusted:true});if(result.error){reload().catch(()=>{});return;}receive(board,data.rev);});
events.onerror=()=>syncStatus('연결 확인 필요');
function drawSoon(){if(!framePending){framePending=true;requestAnimationFrame(()=>{framePending=false;draw();});}}
let W=800,H=600,baseScale=.5;
function project(x,y,z){const cy=Math.cos(camera.yaw),sy=Math.sin(camera.yaw),cp=Math.cos(camera.pitch),sp=Math.sin(camera.pitch);const xx=x*cy+z*sy,zz=-x*sy+z*cy,yy=y*cp-zz*sp,depth=y*sp+zz*cp;const perspective=mode==='flat'?1:1800/(1800+depth);const scale=baseScale*camera.zoom*perspective;return {x:W/2+xx*scale+camera.panX,y:H/2+yy*scale+camera.panY,z:depth,scale};}
function path(points){ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();}
function round(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);}
function clipped(text,max){let out=String(text);while(out.length&&ctx.measureText(out).width>max)out=out.slice(0,-1);return out!==String(text)?out.slice(0,-1)+'…':out;}
function draw(){
 const rect=canvas.getBoundingClientRect();if(!rect.width||!rect.height)return;W=rect.width;H=rect.height;const dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(W*dpr)||canvas.height!==Math.round(H*dpr)){canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);}ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);hits=[];edgeHits=[];positions=new Map();
 ctx.fillStyle='#e0e6ef';for(let x=20;x<W;x+=22)for(let y=20;y<H;y+=22){ctx.beginPath();ctx.arc(x,y,.6,0,Math.PI*2);ctx.fill();}
 const data=visible();const maxRows=Math.max(5,...PLANES.map(p=>data.nodes.filter(n=>n.plane===p).length));const panelH=Math.max(480,maxRows*63+110);baseScale=Math.min((W-50)/1480,(H-125)/(panelH+100));if(W<450)baseScale=Math.max(baseScale,.24);
 const related=trace();
 const panels=PLANES.map((plane,i)=>({plane,i,cx:(i-1.5)*355,z:mode==='flat'?0:(1.5-i)*145}));
 for(const p of panels.slice().sort((a,b)=>project(a.cx,0,a.z).z-project(b.cx,0,b.z).z).reverse()){
 const corners=[[-162,-panelH/2],[162,-panelH/2],[162,panelH/2],[-162,panelH/2]].map(([x,y])=>project(p.cx+x,y,p.z));path(corners);ctx.fillStyle='rgba(255,255,255,.8)';ctx.fill();ctx.strokeStyle='#d7dfe9';ctx.lineWidth=1;ctx.stroke();
 const heading=project(p.cx-139,-panelH/2+31,p.z);ctx.fillStyle=colors[p.plane];ctx.font=`600 ${Math.max(10,17*heading.scale)}px sans-serif`;ctx.fillText(`${String(p.i+1).padStart(2,'0')}  ${planeNames[p.plane]}`,heading.x,heading.y);
 const underline=[project(p.cx-140,-panelH/2+52,p.z),project(p.cx+140,-panelH/2+52,p.z)];ctx.beginPath();ctx.moveTo(underline[0].x,underline[0].y);ctx.lineTo(underline[1].x,underline[1].y);ctx.strokeStyle=colors[p.plane]+'44';ctx.stroke();
 const ns=data.nodes.filter(n=>n.plane===p.plane);ns.forEach((n,index)=>{const dragPosition=transient.get(n.id);const ox=dragPosition?.x??n.x??0,oy=dragPosition?.y??n.y??0;const point=project(p.cx+ox,-panelH/2+96+index*63+oy,p.z);positions.set(n.id,{...point,plane:p.plane,node:n});});
 }
 for(const e of data.edges){const a=positions.get(e.from),b=positions.get(e.to);if(!a||!b)continue;const hot=related.has(e.id);ctx.globalAlpha=selected&&!hot?.1:hot?.95:.22;const horizontal=b.x-a.x;const c1={x:a.x+horizontal*.45,y:a.y},c2={x:b.x-horizontal*.45,y:b.y};ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.bezierCurveTo(c1.x,c1.y,c2.x,c2.y,b.x,b.y);ctx.strokeStyle=hot?'#2563eb':'#7990ab';ctx.lineWidth=selected===e.id?3:hot?2:1;ctx.stroke();const points=[];for(let t=0;t<=1.001;t+=.04){const u=1-t;points.push({x:u*u*u*a.x+3*u*u*t*c1.x+3*u*t*t*c2.x+t*t*t*b.x,y:u*u*u*a.y+3*u*u*t*c1.y+3*u*t*t*c2.y+t*t*t*b.y});}edgeHits.push({id:e.id,points});if(hot){const mid=points[12];ctx.globalAlpha=1;ctx.font='10px sans-serif';const tw=ctx.measureText(e.title).width;round(mid.x-tw/2-5,mid.y-9,tw+10,18,4);ctx.fillStyle='#fff';ctx.fill();ctx.fillStyle='#1746a2';ctx.textAlign='center';ctx.fillText(e.title,mid.x,mid.y+3);ctx.textAlign='left';}}
 ctx.globalAlpha=1;
 for(const point of [...positions.values()].sort((a,b)=>b.z-a.z)){const n=point.node,active=selected===n.id;const scale=point.scale,w=278*scale,h=46*scale,x=point.x-w/2,y=point.y-h/2;ctx.globalAlpha=selected&&!related.has(n.id)?.32:1;round(x,y,w,h,Math.max(4,8*scale));ctx.fillStyle=active?'#eff6ff':'#fff';ctx.fill();ctx.strokeStyle=active?'#2563eb':'#dbe3ec';ctx.lineWidth=active?2:1;ctx.stroke();ctx.fillStyle=colors[n.plane];ctx.beginPath();ctx.arc(x+11*scale,point.y,Math.max(2,3.5*scale),0,Math.PI*2);ctx.fill();ctx.font=`${active?600:500} ${Math.max(10,15*scale)}px sans-serif`;ctx.fillStyle='#26364a';ctx.fillText(clipped(n.title,w-30*scale),x+23*scale,point.y+3.5);if(n.owner&&scale>.65){ctx.font='9px sans-serif';ctx.fillStyle='#687386';ctx.fillText(n.owner,x+23*scale,y+h-3);}hits.push({id:n.id,x,y,w,h});}
 ctx.globalAlpha=1;
 if(!data.nodes.length){ctx.font='14px sans-serif';ctx.fillStyle='#687386';ctx.textAlign='center';ctx.fillText(board?'조건에 맞는 노드가 없어요.':'서버의 구조 지도를 불러오는 중…',W/2,H/2);ctx.textAlign='left';}
}
function distance(p,a,b){const dx=b.x-a.x,dy=b.y-a.y,len=dx*dx+dy*dy;const t=len?Math.max(0,Math.min(1,((p.x-a.x)*dx+(p.y-a.y)*dy)/len)):0;return Math.hypot(p.x-a.x-t*dx,p.y-a.y-t*dy);}
function hit(p){for(const n of hits.slice().reverse())if(p.x>=n.x&&p.x<=n.x+n.w&&p.y>=n.y&&p.y<=n.y+n.h)return {id:n.id,node:true};let nearest=null,d=9;for(const e of edgeHits)for(let i=1;i<e.points.length;i++){const v=distance(p,e.points[i-1],e.points[i]);if(v<d){d=v;nearest={id:e.id,node:false};}}return nearest;}
function pointer(e){const r=canvas.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;const p=pointer(e),target=hit(p);drag={start:p,last:p,target,moved:false,pan:e.shiftKey,pointerId:e.pointerId};canvas.setPointerCapture(e.pointerId);});
canvas.addEventListener('pointermove',e=>{const p=pointer(e);if(!drag){canvas.style.cursor=hit(p)?'pointer':'grab';return;}const dx=p.x-drag.last.x,dy=p.y-drag.last.y;drag.moved ||= Math.hypot(p.x-drag.start.x,p.y-drag.start.y)>4;drag.last=p;if(!drag.moved)return;if(moveMode&&drag.target?.node){const n=find(drag.target.id),previous=transient.get(n.id)||{x:n.x||0,y:n.y||0};transient.set(n.id,{x:Math.max(-120,Math.min(120,previous.x+dx/(baseScale*camera.zoom*Math.cos(camera.yaw)))),y:Math.max(-300,Math.min(300,previous.y+dy/(baseScale*camera.zoom)))});}else if(drag.pan||mode==='flat'){camera.panX+=dx;camera.panY+=dy;}else{camera.yaw=Math.max(-1,Math.min(1,camera.yaw+dx*.004));camera.pitch=Math.max(-.65,Math.min(.65,camera.pitch+dy*.004));}drawSoon();});
canvas.addEventListener('pointerup',async e=>{if(!drag)return;const d=drag;drag=null;if(canvas.hasPointerCapture(e.pointerId))canvas.releasePointerCapture(e.pointerId);if(!d.moved){if(d.target)choose(d.target.id);return;}if(moveMode&&d.target?.node&&transient.has(d.target.id)){const n=find(d.target.id),position=transient.get(n.id);try{await operation({type:'spatial.node.update',id:n.id,expectedVersion:n.version,fields:position});}catch(err){toast(err.message);}finally{transient.delete(n.id);drawSoon();}}});
canvas.addEventListener('pointercancel',()=>{drag=null;transient.clear();drawSoon();});
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.zoom=Math.max(.5,Math.min(3,camera.zoom*Math.exp(-e.deltaY*.001)));drawSoon();},{passive:false});
canvas.addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','+','-','Escape'].includes(e.key)){e.preventDefault();if(e.key==='Escape')choose(null);else if(e.key==='+'||e.key==='-')camera.zoom=Math.max(.5,Math.min(3,camera.zoom+(e.key==='+'?.1:-.1)));else if(e.key==='ArrowLeft'||e.key==='ArrowRight')camera.yaw+=e.key==='ArrowLeft'?-.08:.08;else camera.pitch+=e.key==='ArrowUp'?-.08:.08;drawSoon();}});
function view(next){mode=next;camera={yaw:next==='flat'?0:-.24,pitch:next==='flat'?0:.14,zoom:1,panX:0,panY:0};$('view-3d').setAttribute('aria-pressed',next==='3d');$('view-flat').setAttribute('aria-pressed',next==='flat');drawSoon();}
document.addEventListener('click',async e=>{const pick=e.target.closest('[data-select]');if(pick){choose(pick.dataset.select);return;}const f=e.target.closest('[data-feature]');if(f){if(dirty&&!confirm('현재 편집을 취소하고 기능을 바꿀까요?'))return;feature=f.dataset.feature;selected=null;dirty=false;camera.panX=camera.panY=0;renderAll();return;}const id=e.target.closest('button')?.id;if(id==='view-3d')view('3d');if(id==='view-flat')view('flat');if(id==='fit')view(mode);if(id==='zoom-in'||id==='zoom-out'){camera.zoom=Math.max(.5,Math.min(3,camera.zoom*(id==='zoom-in'?1.2:1/1.2)));drawSoon();}if(id==='rotate-left'||id==='rotate-right'){if(mode==='flat')view('3d');camera.yaw=Math.max(-1,Math.min(1,camera.yaw+(id==='rotate-left'?-.12:.12)));drawSoon();}if(id==='move-mode'){moveMode=!moveMode;$('move-mode').setAttribute('aria-pressed',moveMode);$('stage-help').textContent=moveMode?'노드를 드래그하면 같은 면 안에서 배치하고 서버에 저장합니다.':'빈 곳 드래그: 회전 · Shift 드래그: 이동 · 휠: 확대 · 노드/선: 상세';}if(id==='clear')choose(null);if(id==='revert'){dirty=false;await reload().catch(err=>toast(err.message));inspector();}if(id==='add-node')newItem('node');if(id==='add-edge')newItem('edge');if(id==='cancel-create')inspector();if(id==='set-name'){username=$('username').value.trim().slice(0,20)||'이름 미설정';try{localStorage.setItem('workboard-collab-name',username);}catch{}try{await fetch('/api/presence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client,name:username})});toast('편집자 이름을 적용했습니다.');}catch{toast('이름 변경을 서버에 전달하지 못했어요.');}}if(id==='export'&&board){const url=URL.createObjectURL(new Blob([JSON.stringify(board,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='studymeta-spatial-workboard.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
