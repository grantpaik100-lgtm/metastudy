<style>

*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI','Malgun Gothic',sans-serif}button,input,select,textarea{font:inherit;color:inherit}button,a,input,select,textarea{touch-action:manipulation}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:7px 11px}button:hover{background:var(--surface-soft);border-color:var(--line-strong)}button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:3px solid var(--blue-line);outline-offset:2px}input,select,textarea{width:100%;min-width:0;border:1px solid var(--line-strong);border-radius:7px;padding:8px;background:var(--surface)}textarea{resize:vertical;line-height:1.6}a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}h1,h2,h3,p{margin:0}h1{font-size:19px;letter-spacing:-.5px}h2{font-size:18px}small,.muted{color:var(--muted)}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 24px;background:var(--surface);border-bottom:1px solid var(--line)}.brand{display:flex;gap:12px;align-items:center}.mark{background:var(--blue);color:white;border-radius:11px;font-size:26px;width:42px;height:42px;text-align:center}.eyebrow{font-size:10px;letter-spacing:2px;color:var(--muted);font-weight:700}.top-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.badge{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:11px}.badge:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--green)}.workspace{display:grid;grid-template-columns:204px minmax(0,1fr) 304px;min-height:calc(100vh - 80px)}.rail{padding:22px 14px;border-right:1px solid var(--line);background:var(--surface);min-width:0}.rail-title{display:flex;justify-content:space-between;margin-bottom:14px;font-weight:600;font-size:12px}.rail input{font-size:12px;margin-bottom:14px}.feature{display:flex;align-items:center;width:100%;border:0;background:n );padding:5px;border-radius:11px;box-shadow:var(--shadow);white-space:nowrap}.stage-controls button{border:0;padding:5px 9px;font-size:12px}.stage-controls [aria-pressed=true]{background:var(--blue-soft);color:var(--blue)}.stage-help{position:absolute;bottom:67px;left:22px;color:var(--muted);font-size:10px;pointer-events:none}.timeline{border-top:1px solid var(--line);padding:14px 22px 18px;background:var(--surface)}.timeline-top{display:flex;justify-content:space-between;align-items:center;font-size:11px}.timeline label{display:flex;gap:8px;align-items:center}.timeline input[type=range]{padding:0;border:0;margin:10px 0;accent-color:var(--blue)}.time-labels{display:flex;justify-content:space-between;font-size:10px;color:var(--muted)}.inspector{background:var(--surface);border-left:1px solid var(--line);padding:20px 18px;min-width:0;max-height:calc(100vh - 80px);overflow:auto}.inspector .section-kicker{font-size:10px;letter-spacing:1px;color:var(--muted);margin-bottom:10px}.inspector h2{margin-bottom:8px;overflow-wrap:anywhere}.inspector .description{font-size:12px;color:var(--muted);line-height:1.8;white-space:pre-wrap}.field{display:block;font-size:11px;font-weight:600;margin-top:13px}.field>span{display:block;margin-bottom:5px}.field input,.field select,.field textarea{font-weight:400;font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.save-row{display:flex;gap:6px;margin:16px 0}.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.primary:hover{background:var(--blue-dark);color:#fff}.meta{font-size:10px;color:var(--muted);line-height:1.8;overflow-wrap:anywhere}.relations{border-top:1px solid var(--line);padding-top:14px;margin-top:20px}.relation{width:100%;text-align:left;font-size:11px;display:block;margin:5px 0;padding:9px}.relation small{display:block;font-size:10px}.link-source{display:block;overflow-wrap:anywhere;font-size:11px;margin:5px 0}.empty-inspector{padding:26px 3px}.empty-symbol{font-size:40px;color:var(--blue-line);margin:20px 0}.empty-inspector p{font-size:12px;color:var(--muted);line-height:1.8;margin:10px 0}.count-line{font-size:11px;color:var(--muted);margin-top:20px}.note{background:var(--amber-soft);color:var(--amber);font-size:11px;padding:10px;border-radius:8px;margin:10px 0;line-height:1.7}.hint-list{display:grid;gap:10px;margin:20px 0;font-size:12px}.history{font-size:11px;margin-top:15px}.history summary{cursor:pointer}.history article{border-left:2px solid var(--line);padding:8px 10px;margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.history small{display:block}.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--text);color:white;padding:10px 18px;border-radius:10px;z-index:10;max-width:90vw;font-size:12px}.toast:empty{display:none}.screen-preview{border:1px solid var(--line);border-radius:10px;margin:12px 0;overflow:hidden;background:#fff}.screen-preview svg{display:block;width:100%;max-height:390px}.screen-preview summary{padding:9px;font-size:11px;cursor:pointer}.embed .top{padding:12px 18px}.embed .workspace{min-height:680px;grid-template-columns:165px minmax(0,1fr) 270px}.embed .inspector{max-height:820px}.embed .top .back{display:none}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:1200px){.workspace{grid-template-columns:175px minmax(0,1fr) 275px}.top{padding:14px 18px}.legend{gap:8px}.embed .workspace{grid-template-columns:140px minmax(0,1fr) 250px}}
@media(max-width:960px){.workspace,.embed .workspace{grid-template-columns:160px minmax(0,1fr)}.inspector{grid-column:1/-1;border-top:1px solid var(--line);max-height:none;display:block}.stage{min-height:530px}.top-actions .back{display:none}.rail{grid-row:1}.inspector form{max-width:720px;margin:auto}.empty-inspector{padding:5px}.empty-symbol{display:none}.top{flex-wrap:wrap}.node-list{max-height:280px}}
@media(max-width:600px){.workspace,.embed .workspace{display:block}.top{padding:12px}.top-actions{gap:5px}.top-actions button{font-size:11px}.rail{padding:12px;border-bottom:1px solid var(--line);border-right:0}.rail-title,.rail-note,.mini-heading,.node-list{display:none}.rail input{margin-bottom:8px}.features{display:flex;flex-wrap:wrap;gap:2px}.feature{width:auto;font-size:11px;padding:6px 8px}.feature small{display:none}.feature:before{display:none}.stage{min-height:470px}.view-head{padding:16px 14px 8px}.view-head h2{font-size:18px}.legend{left:14px}.stage-help{left:14px;max-width:80%}.timeline{padding:12px 14px}.inspector{padding:18px}.top h1{font-size:17px}.badge{font-size:10px}.mark{width:36px;height:36px;font-size:23px}.time-labels{font-size:9px}.stage-controls button{min-height:35px}.segmented button{padding:7px 9px}.two input{font-size:14px}input,select,textarea{font-size:16px}}

<body>
<header class="top"><div class="brand"><div class="mark" aria-hidden="true">◇</div><div><div class="eyebrow">STUDYMETA / WORKBOARD</div><h1>3D 구조 지도</h1></div></div><div class="top-actions"><span class="badge" id="connection" role="status">연결 중</span><a class="back" href="./#spatial">작업판으로 ↗</a><button id="add-node">＋ 노드</button><button id="add-edge">＋ 연결</button><button id="export">내보내기 ↗</button></div></header>
<div class="workspace"><aside class="rail" aria-label="기능 위계"><div class="rail-title">기능 구조 <span class="muted">01—07</span></div><label><span class="sr-only">노드·연결 검색</span><input id="search" placeholder="기능·도구·담당자 검색"></label><div class="features" id="features"></div><details id="element-tree" style="margin-top:18px"><summary style="font-size:11px;cursor:pointer;color:var(--muted)">세부 항목 목록</summary><div id="node-list" class="node-list"></div></details><p class="rail-note">9월 작업판 + 10월 수정 PR의 연결 초안입니다.<br>담당·최초 기획일·운영일은 확인된 경우에만 입력합니다.</p></aside>
<section class="stage-column" aria-label="네 면과 연결"><header class="view-head"><div><h2 id="feature-title">계획·자료</h2><p id="visible-count">구조를 불러오고 있어요</p></div><div class="segmented"><button id="view-3d" aria-pressed="true">3D</button><button id="view-flat" aria-pressed="false">면 자세히</button></div></header>
<div class="stage" id="stage"><div class="legend"><span><i class="dot" style="background:#7760b5"></i>기획</span><span><i class="dot" style="background:#2563eb"></i>UI·UX</span><span><i class="dot" style="background:#168f86"></i>MCP</span><span><i class="dot" style="background:#b87c36"></i>백엔드</span></div><div id="scene" tabindex="0" aria-label="서로 직교하는 네 면. 빈 곳 드래그 또는 방향키로 회전. 분야 버튼으로 면을 선택하세요."></div><div class="stage-help" id="stage-help">빈 곳 드래그: 회전 · Shift 드래그: 이동 · 휠: 확대 · 노드/선: 상세</div><div class="stage-controls"><button id="rotate-left" aria-label="왼쪽 회전">↶</button><button id="rotate-right" aria-label="오른쪽 회전">↷</button><button id="zoom-out" aria-label="축소">−</button><button id="zoom-in" aria-label="확대">＋</button><button id="fit">전체 맞춤</button><button id="clear">선택 해제</button></div></div>
<footer class="timeline"><div class="timeline-top"><label for="time">지도에 기록한 날짜 <strong id="time-value">전체 시점</strong></label><span id="unknown-date">날짜 미확인 포함</span></div><input id="time" type="range" min="0" max="3" value="3" step="1" aria-label="추가 시점 필터"><div class="time-labels"><span>09.27 기록</span><span>09.28 기록</span><span>10.17 기록</span><span>전체</span></div></footer></section>
<aside id="inspector" class="inspector" aria-label="선택 항목 상세"></aside></div><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script type="module">
import {cloud,identity,apiFetch,connectEvents} from './transport.js';
import {normalizeBoard,applyOp} from './board-ops.js';
import {PLANES,STATES} from './spatial-ops.js';
import {createSpatialView} from './spatial-view.js';
const $=id=>document.getElementById(id), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const planeNames={idea:'기획·아이디어',ux:'채팅 UI·UX',mcp:'MCP',backend:'백엔드'};
const colors={idea:'#7760b5',ux:'#2563eb',mcp:'#168f86',backend:'#b87c36'};
const days=['2026-09-27','2026-09-28','2026-10-17',''];
if(new URLSearchParams(location.search).has('embed'))document.body.classList.add('embed');
if(innerWidth<600){$('element-tree').open=false;$('node-list').style.display='block';}
const params=new URLSearchParams(location.search),initialPlane=params.get('plane');
let board,revision=-1,selected=params.get('selected'),feature=initialPlane?'':'계획·자료',search='',mode='3d',filterDate='',saveBusy=false;
let camera={yaw:-.24,pitch:.14,zoom:1,panX:0,panY:0};
let editorVersion=0,editorBaseline={},dirty=false,toastTimer;
const client=crypto.randomUUID();
const sceneView=createSpatialView({stage:$('stage'),scene:$('scene'),getState:()=>({...visible(),allNodes:graph().nodes,selected,trace:trace()}),choose,openPlane:p=>{const url=params.has('embed')?'./#'+p+(selected?'/'+encodeURIComponent(selected):''):'./spatial.html?plane='+p+(selected?'&selected='+encodeURIComponent(selected):'');if(params.has('embed'))window.top.location.href=url;else location.href=url;}});
if(PLANES.includes(initialPlane)){sceneView.focus(initialPlane,true);mode='flat';$('view-3d').setAttribute('aria-pressed','false');$('view-flat').setAttribute('aria-pressed','true');document.querySelector('h1').textContent=planeNames[initialPlane];}
let username;try{username=localStorage.getItem('workboard-collab-name')||'이름 미설정';}catch{username='이름 미설정';}
if(cloud){username=identity.name;const link=document.createElement('a');link.href='/account.html';link.target='_top';link.textContent='계정 · AI 연결';document.querySelector('.top-actions').append(link);}
const graph=()=>board?.spatial||{nodes:[],edges:[]};
const all=()=>[...graph().nodes,...graph().edges];
const find=id=>all().find(n=>n.id===id);
function toast(message){$('toast').textContent=message;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',6000);}
function syncStatus(text){$('connection').textContent=text;}
function featureNames(){return [...new Set(graph().nodes.map(n=>n.feature))];}
function isNode(n){return 'plane' in n;}
function ageVisible(n){return !filterDate||!n.introduced||n.introduced<=filterDate;}
function trace(){
 const ids=new Set();if(!selected)return ids;const start=find(selected);if(!start)return ids;ids.add(selected);
 const typed=isNode(start)?!!start.kind:!!start.relation;
 const eligible=e=>ageVisible(e)&&(!typed||!!e.relation)&&(!typed||start.kind==='file'?true:e.relation!=='imports');
 function walk(id,direction,depth,seen=new Set()){if(depth>7||seen.has(id))return;seen.add(id);ids.add(id);for(const e of graph().edges){if(!eligible(e))continue;const match=direction==='up'?e.to===id:e.from===id;if(match){ids.add(e.id);const next=direction==='up'?e.from:e.to;ids.add(next);if(e.relation!=='navigates')walk(next,direction,depth+1,seen);}}}
 if(isNode(start)){walk(start.id,'up',0);walk(start.id,'down',0);}else{walk(start.from,'up',0);ids.add(start.from);ids.add(start.to);walk(start.to,'down',0);}return ids;
}
function visible(){
 const traced=trace();let nodes=graph().nodes.filter(n=>ageVisible(n)&&(!feature||n.feature===feature||traced.has(n.id)));
 if(search){const matching=new Set(all().filter(n=>[n.title,n.description,n.owner,n.followup,n.source,n.filePath,n.symbol,n.toolName].join(' ').toLowerCase().includes(search)).map(n=>n.id));for(const e of graph().edges)if(matching.has(e.id)){matching.add(e.from);matching.add(e.to);}nodes=nodes.filter(n=>matching.has(n.id));}
 const ids=new Set(nodes.map(n=>n.id));return {nodes,edges:graph().edges.filter(e=>ids.has(e.from)&&ids.has(e.to)&&ageVisible(e))};
}
function sidebar(){
 const names=featureNames();$('features').innerHTML=[['','전체 구조'],...names.map(n=>[n,n])].map(([v,title])=>`<button class="feature" data-feature="${esc(v)}" aria-pressed="${feature===v}">${esc(title)}<small>${graph().nodes.filter(n=>!v||n.feature===v).length}</small></button>`).join('');
 const {nodes,edges}=visible();$('feature-title').textContent=(initialPlane?planeNames[initialPlane]+' · ':'')+(feature||'전체 구조');$('visible-count').textContent=`${nodes.length}개 노드 · ${edges.length}개 연결 · 상세 공간과 같은 데이터`;
 $('node-list').innerHTML=PLANES.map(p=>`<details open><summary>${planeNames[p]}</summary>${nodes.filter(n=>n.plane===p).map(n=>`<button data-select="${esc(n.id)}" aria-pressed="${selected===n.id}">${n.parentId?'↳ ':''}${esc(n.title)}</button>`).join('')}</details>`).join('')+`<details><summary>연결선 ${edges.length}개</summary>${edges.map(e=>`<button data-select="${esc(e.id)}" aria-pressed="${selected===e.id}">${esc(e.title)} · ${esc(find(e.from)?.title||'')}</button>`).join('')}</details>`;
 $('unknown-date').textContent=`날짜 미확인 ${nodes.filter(n=>!n.introduced).length}개 포함`;
}
function renderAll(preserveEditor=false){sidebar();drawSoon();if(!preserveEditor)inspector();}
function choose(id){if(dirty&&!confirm('저장하지 않은 편집이 있어요. 항목을 바꾸고 편집을 취소할까요?'))return;selected=id;dirty=false;renderAll();}
function input(label,name,value='',type='text'){return `<label class="field"><span>${label}</span><input type="${type}" name="${name}" value="${esc(value)}" ${name==='title'?'required maxlength="200"':''}></label>`;}
function area(label,name,value,rows=3){return `<label class="field"><span>${label}</span><textarea name="${name}" rows="${rows}">${esc(value)}</textarea></label>`;}
function selectField(label,name,value,options){return `<label class="field"><span>${label}</span><select name="${name}">${options.map(([v,t])=>`<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`).join('')}</select></label>`;}
function sources(s){return String(s||'').split('\n').filter(Boolean).map(line=>/^https?:\/\//.test(line.trim())?`<a class="link-source" href="${esc(line.trim())}" target="_blank" rel="noopener noreferrer">근거 문서 ↗</a>`:`<div class="meta">${esc(line)}</div>`).join('');}
function preview(n){const screen=board.screens.find(s=>'ux-'+s.id===n.id);if(!screen?.drawing?.shapes)return '';const shapes=screen.drawing.shapes;const height=Math.max(650,...shapes.map(s=>(Number(s.y)||0)+(Number(s.h)||0)+20));const palette={accent:'#d7f4f1',soft:'#f1f4f7',dark:'#29384b',line:'#fff'};const svg=shapes.map(s=>{const x=Number(s.x)||0,y=Number(s.y)||0,w=Number(s.w)||0,h=Number(s.h)||0;const textColor=s.tone==='dark'?'#fff':'#29384b';let shape=s.type==='rect'?`<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" rx="${s.round?7:0}" fill="${palette[s.tone]||'#fff'}" stroke="#d9e3e6"/>`:s.type==='ellipse'?`<ellipse cx="${x+w/2}" cy="${y+h/2}" rx="${Math.abs(w/2)}" ry="${Math.abs(h/2)}" fill="#eff6ff" stroke="#a9b8c8"/>`:['line','arrow'].includes(s.type)?`<path d="M ${x} ${y} l ${w} ${h}" stroke="#8da2b5" fill="none"/>`:'';if(s.text)shape+=`<text x="${x+4}" y="${y+(s.type==='text'?16:h/2+5)}" font-size="${s.size==='s'?11:s.size==='l'?17:14}" fill="${textColor}">${esc(s.text)}</text>`;return shape;}).join('');return `<details class="screen-preview"><summary>원본 와이어프레임 보기</summary><svg viewBox="0 0 375 ${height}" role="img" aria-label="${esc(screen.title)}">${svg}</svg></details>`;}
function inspector(){
 const n=find(selected);if(!n){$('inspector').innerHTML=`<div class="empty-inspector"><div class="section-kicker">CONNECTION ATLAS</div><div class="empty-symbol">◇ ⤳ ◇</div><h2>하나를 고르면<br>연결이 보입니다.</h2><p>노드나 선을 선택해 기획부터 구현까지 따라가 보세요. 연결선에도 담당자와 후속 과제를 남길 수 있어요.</p><div class="hint-list"><span>01　면은 서로 다른 관점</span><span>02　노드는 기능과 구현 요소</span><span>03　선은 둘 사이의 관계</span></div><p>날짜 필터는 확인된 추가 시점으로 거릅니다. 과거 내용 전체를 복원하는 타임머신은 아직 아닙니다.</p><div class="note">코드 확인 항목에는 소스 버전과 근거가 있습니다. 기획 대응은 검토 초안이며, 운영 호출 기록은 아닙니다.</div><label class="field"><span>편집자 표시 이름</span><input id="username" value="${esc(username)}" maxlength="20"></label><button id="set-name" style="margin-top:8px">이름 적용</button><div class="count-line">${graph().nodes.length}개 노드 / ${graph().edges.length}개 연결<br>공유 서버 저장 · 같은 서버에 연결된 창 간 동기화</div></div>`;if(cloud){$('username').readOnly=true;$('set-name').hidden=true;}return;}
 const node=isNode(n);editorVersion=n.version;editorBaseline=structuredClone(n);dirty=false;
 const relation=graph().edges.filter(e=>e.from===n.id||e.to===n.id);
 $('inspector').innerHTML=`<div class="section-kicker">${node?planeNames[n.plane]+' / NODE':'RELATION / 연결선'}</div><h2>${esc(n.title)}</h2>${!node?`<p class="description">${esc(find(n.from)?.title)} → ${esc(find(n.to)?.title)}</p>`:''}<div id="edit-notice" class="note" hidden></div>${preview(n)}${codeDetails(n)}<form id="edit-form">${input('이름 / 관계 이름','title',n.title)}${area('내용과 의미','description',n.description)}${structureFields(n)}<div class="two">${input('담당자 · 미정이면 빈칸','owner',n.owner)}${selectField('상태','status',n.status,STATES.map(s=>[s,s]))}</div>${node?selectField('상위 노드 · 같은 면의 위계','parentId',n.parentId,[['','상위 없음'],...graph().nodes.filter(x=>x.plane===n.plane&&x.id!==n.id).map(x=>[x.id,x.title])]):''}<div class="two">${input('확인된 추가일','introduced',n.introduced,'date')}${input('기획일','planned',n.planned,'date')}${input('구현일','implemented',n.implemented,'date')}${input('운영 반영일','deployed',n.deployed,'date')}</div>${area('후속으로 생각할 것 / 다음 행동','followup',n.followup,4)}${area('근거 · 문서 / 코드 / PR 링크','source',n.source,2)}<div class="save-row"><button class="primary" type="submit" id="save">변경 저장</button><button type="button" id="revert">최신 내용 다시 보기</button></div><div class="meta">${n.updatedAt?'마지막 수정 '+esc(new Date(n.updatedAt).toLocaleString('ko-KR'))+' · '+esc(n.updatedBy):'수정 이력 없음 · 초기 연결 초안'}<br>담당자와 편집자는 별도입니다. ${cloud?'수정자는 로그인한 계정으로 기록됩니다.':'이름은 로그인 인증 정보가 아닙니다.'}</div></form>${sources(n.source)}<div class="relations"><div class="section-kicker">${node?'연결된 관계':'양 끝의 노드'}</div>${node?relation.map(e=>`<button class="relation" data-select="${esc(e.id)}">${esc(e.title)}<small>${esc(find(e.from)?.title)} → ${esc(find(e.to)?.title)}</small></button>`).join(''):[n.from,n.to].map(id=>`<button class="relation" data-select="${esc(id)}">${esc(find(id)?.title)}</button>`).join('')}</div><details class="history"><summary>변경 이력 ${n.history.length}건</summary>${n.history.slice().reverse().map(h=>`<article><small>${esc(h.at)} · ${esc(h.by)}</small>${Object.entries(h.after).map(([k,v])=>`${esc(k)}: ${esc(h.before[k]||'미입력')} → ${esc(v||'미입력')}`).join('\n')}</article>`).join('')}</details>`;
 $('edit-form').addEventListener('input',()=>{dirty=true;});$('edit-form').addEventListener('submit',saveEdit);
}
function codeDetails(n){return '<div class="code-reference">'+(n.kind?'<strong>'+esc(n.kind)+' · '+(n.evidence==='code'?'코드에서 확인':'검토 초안')+'</strong>':'')+(n.filePath?'<p>'+esc(n.filePath)+(n.symbol?' → '+esc(n.symbol):'')+'</p>':'')+(n.codeRef?'<p>확인한 소스 '+esc(n.codeRef.slice(0,12))+' · 운영 반영 여부 별도</p>':'')+(n.codeExcerpt?'<details><summary>확인한 코드 보기</summary><pre>'+esc(n.codeExcerpt)+'</pre></details>':'')+'</div>';}
function structureFields(n){return '<details class="structure-fields"><summary>구조 정보 편집</summary>'+ (isNode(n)?selectField('항목 종류','kind',n.kind||'',[['','일반'],['idea','아이디어'],['goal','큰 목표'],['screen','화면'],['button','버튼'],['tool','도구'],['file','파일'],['function','함수'],['rpc','DB 함수'],['table','테이블']])+input('소속 파일','filePath',n.filePath)+input('함수 / 심볼','symbol',n.symbol)+input('UI 화면 키','uiScreen',n.uiScreen)+input('UI 버튼 선택자','uiSelector',n.uiSelector)+input('MCP 도구 이름','toolName',n.toolName):selectField('출발 노드','from',n.from,graph().nodes.map(x=>[x.id,x.title]))+selectField('도착 노드','to',n.to,graph().nodes.map(x=>[x.id,x.title]))+input('관계 종류','relation',n.relation))+selectField('근거 상태','evidence',n.evidence||'draft',[['draft','검토 초안'],['code','코드에서 확인'],['unverified','확인 필요']])+'</details>';}
async function operation(op){
 const response=await apiFetch('/api/op',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client,op,requestId:crypto.randomUUID()}),signal:AbortSignal.timeout(10000)});const data=await response.json();if(!response.ok)throw new Error(data.message||'저장 결과를 확인할 수 없어요.');await reload();return data;
}
async function saveEdit(e){e.preventDefault();if(saveBusy)return;const values=Object.fromEntries(new FormData(e.target));const fields=Object.fromEntries(Object.entries(values).filter(([k,v])=>v!==(editorBaseline[k]||'')));if(!Object.keys(fields).length){toast('변경된 내용이 없어요.');return;}saveBusy=true;$('save').disabled=true;try{await operation({type:`spatial.${isNode(editorBaseline)?'node':'edge'}.update`,id:selected,expectedVersion:editorVersion,fields});dirty=false;inspector();toast('서버에 저장했습니다.');}catch(error){toast(error.message);await reload();}finally{saveBusy=false;if($('save'))$('save').disabled=false;}}
function newItem(kind){if(dirty&&!confirm('저장하지 않은 편집을 취소하고 새 항목을 만들까요?'))return;selected=null;dirty=false;const featureOptions=featureNames().map(n=>[n,n]);const nodeOptions=graph().nodes.map(n=>[n.id,planeNames[n.plane]+' · '+n.title]);$('inspector').innerHTML=`<div class="section-kicker">CREATE / ${kind==='node'?'NODE':'RELATION'}</div><h2>${kind==='node'?'새 노드':'새 연결선'}</h2><form id="new-form">${input('이름','title')}${kind==='node'?selectField('면','plane','idea',PLANES.map(p=>[p,planeNames[p]])):selectField('출발 노드','from',nodeOptions[0]?.[0],nodeOptions)+selectField('도착 노드','to',nodeOptions[1]?.[0],nodeOptions)}${selectField('기능 영역','feature',feature||featureNames()[0],featureOptions)}${area('내용과 의미','description','')}${kind==='node'?selectField('항목 종류','kind','idea',[['idea','아이디어'],['goal','큰 목표'],['screen','화면'],['button','버튼'],['tool','MCP 도구'],['file','파일'],['function','함수'],['rpc','DB 함수'],['table','테이블']]):input('관계 종류 · 예: calls, navigates, imports','relation','calls')}${input('담당자','owner')}${area('후속으로 생각할 것','followup','')}<div class="save-row"><button type="submit" class="primary">${kind==='node'?'노드 만들기':'연결 만들기'}</button><button type="button" id="cancel-create">취소</button></div></form>`;$('new-form').addEventListener('submit',async e=>{e.preventDefault();if(saveBusy)return;saveBusy=true;const submit=e.submitter;submit.disabled=true;const item={...Object.fromEntries(new FormData(e.target)),id:crypto.randomUUID(),status:'기획',introduced:new Date().toLocaleDateString('en-CA'),planned:'',implemented:'',deployed:'',source:'작업판에서 직접 추가',parentId:''};try{await operation({type:`spatial.${kind}.create`,item});feature=item.feature;choose(item.id);toast('새 항목을 저장했습니다.');}catch(err){toast(err.message);}finally{saveBusy=false;submit.disabled=false;}});}
function receive(next,rev){const normalized=normalizeBoard(next);if(!normalized){toast('서버의 작업판 형식을 확인해주세요.');return;}board=normalized;revision=rev;if(feature&&!featureNames().includes(feature))feature='';const n=find(selected);const preserve=!!$('new-form')||dirty||saveBusy;renderAll(preserve);if(preserve&&n&&n.version!==editorVersion&&$('edit-notice')){const notice=$('edit-notice');notice.hidden=false;notice.textContent='서버에 새 변경이 있습니다. 현재 편집은 남아 있어요. 저장 전 최신 내용을 확인해주세요.';}}
async function reload(){const response=await apiFetch('/api/state',{signal:AbortSignal.timeout(10000)});if(!response.ok)throw new Error('서버에 연결하지 못했어요.');const data=await response.json();receive(data.board,data.rev);}
const events=connectEvents(`/api/events?client=${client}&name=${encodeURIComponent(username)}&color=${encodeURIComponent('#2563eb')}`);
events.addEventListener('hello',e=>{const data=JSON.parse(e.data);receive(data.board,data.rev);syncStatus('서버 연결됨');});
events.addEventListener('op',e=>{const data=JSON.parse(e.data);if(data.rev<=revision)return;if(data.rev!==revision+1){reload().catch(()=>syncStatus('다시 연결 중'));return;}const result=applyOp(board,data.op,{trusted:true});if(result.error){reload().catch(()=>{});return;}receive(board,data.rev);});
events.onerror=()=>syncStatus('연결 확인 필요');
function drawSoon(){sceneView.draw();}
function view(next){mode=next;sceneView.view(next);$('view-3d').setAttribute('aria-pressed',next==='3d');$('view-flat').setAttribute('aria-pressed',next==='flat');}
document.addEventListener('click',async e=>{const pick=e.target.closest('[data-select]');if(pick){choose(pick.dataset.select);return;}const f=e.target.closest('[data-feature]');if(f){if(dirty&&!confirm('현재 편집을 취소하고 기능을 바꿀까요?'))return;feature=f.dataset.feature;selected=null;dirty=false;camera.panX=camera.panY=0;renderAll();return;}const id=e.target.closest('button')?.id;if(id==='view-3d')view('3d');if(id==='view-flat')view('flat');if(id==='fit')view(mode);if(id==='zoom-in'||id==='zoom-out'){sceneView.zoom(id==='zoom-in'?1.2:1/1.2);}if(id==='rotate-left'||id==='rotate-right'){if(mode==='flat')view('3d');sceneView.rotate(id==='rotate-left'?-45:45);}if(id==='clear')choose(null);if(id==='revert'){dirty=false;await reload().catch(err=>toast(err.message));inspector();}if(id==='add-node')newItem('node');if(id==='add-edge')newItem('edge');if(id==='cancel-create')inspector();if(id==='set-name'){username=$('username').value.trim().slice(0,20)||'이름 미설정';try{localStorage.setItem('workboard-collab-name',username);}catch{}try{await apiFetch('/api/presence',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({client,name:username})});toast('편집자 이름을 적용했습니다.');}catch{toast('이름 변경을 서버에 전달하지 못했어요.');}}if(id==='export'&&board){const url=URL.createObjectURL(new Blob([JSON.stringify(board,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='studymeta-spatial-workboard.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);}});
$('search').addEventListener('input',e=>{search=e.target.value.trim().toLowerCase();sidebar();drawSoon();});$('time').addEventListener('input',e=>{filterDate=days[+e.target.value];$('time-value').textContent=filterDate||'전체 시점';sidebar();drawSoon();});
new ResizeObserver(drawSoon).observe($('stage'));inspector();drawSoon();
</script></body></html>
