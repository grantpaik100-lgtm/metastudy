async function message(text){try{if(window.openai?.sendFollowUpMessage){await window.openai.sendFollowUpMessage({prompt:text,scrollToBottom:true})}else{await request('ui/message',{role:'user',content:[{type:'text',text}]})}live.textContent='채팅으로 요청을 보냈어요.';return true}catch{live.textContent='채팅 입력창에서 같은 요청을 다시 보내주세요.';return false}}

function feedbackSheet(){return '<div class="feedback-layer" role="presentation"><section class="feedback-sheet" role="dialog" aria-modal="true" aria-labelledby="feedback-title"><div class="feedback-head"><div><p class="eyebrow">내부 파일럿</p><h2 class="title" id="feedback-title">피드백 남기기</h2><p class="lead">마이크를 누르고 편하게 말해주세요.</p></div><button type="button" class="feedback-close" data-feedback-close aria-label="피드백 닫기">×</button></div><div class="feedback-mic-wrap"><button type="button" class="feedback-mic" data-feedback-mic aria-pressed="'+String(feedbackListening)+'">'+(feedbackListening?'듣는 중…':'말하기')+'</button></div><div class="feedback-copy '+(feedbackDraft?'':'empty')+'" id="feedback-copy">'+(feedbackDraft?esc(feedbackDraft):'말한 내용이 여기에 짧게 표시돼요.')+'</div>'+(feedbackUnsupported?'<textarea class="feedback-fallback" id="feedback-fallback" maxlength="10000" placeholder="이 환경에서는 음성인식이 어려워요. 여기에 짧게 적어주세요.">'+esc(feedbackDraft)+'</textarea>':'')+'<label class="feedback-context"><span>현재 화면 정보 함께 보내기<small>화면·Plan·버전 정보만 포함해요</small></span><input type="checkbox" id="feedback-context" '+(feedbackIncludeContext?'checked':'')+'></label><div class="feedback-actions"><button type="button" class="cancel" data-feedback-close>취소</button><button type="button" class="send" data-feedback-send '+(feedbackDraft.trim()?'':'disabled')+'>보내기</button></div><p class="feedback-status" id="feedback-status" aria-live="polite">'+esc(feedbackMessage)+'</p></section></div>'}
function renderFeedback(){feedbackRoot.innerHTML=feedbackOpen?feedbackSheet():'';feedbackTrigger.hidden=feedbackOpen;if(!feedbackOpen){size();return}feedbackRoot.querySelectorAll('[data-feedback-close]').forEach(el=>el.addEventListener('click',closeFeedback));feedbackRoot.querySelector('[data-feedback-mic]')?.addEventListener('click',startFeedbackSpeech);feedbackRoot.querySelector('[data-feedback-send]')?.addEventListener('click',submitFeedback);feedbackRoot.querySelector('#feedback-context')?.addEventListener('change',e=>{feedbackIncludeContext=e.target.checked});feedbackRoot.querySelector('#feedback-fallback')?.addEventListener('input',e=>{feedbackDraft=e.target.value;const send=feedbackRoot.querySelector('[data-feedback-send]');if(send)send.disabled=feedbackSending||!feedbackDraft.trim()||feedbackDraft.length>10000;const copy=feedbackRoot.querySelector('#feedback-copy');if(copy){copy.textContent=feedbackDraft||'말한 내용이 여기에 짧게 표시돼요.';copy.classList.toggle('empty',!feedbackDraft)}});size()}
function openFeedback(){feedbackOpen=true;feedbackDraft='';feedbackListening=false;feedbackIncludeContext=true;feedbackUnsupported=true;feedbackMessage='';renderFeedback()}
function stopFeedbackSpeech(){try{feedbackRecognition?.abort()}catch{}feedbackRecognition=null;feedbackListening=false}
function closeFeedback(){stopFeedbackSpeech();feedbackOpen=false;renderFeedback();feedbackTrigger.focus()}
function updateFeedbackView(){const mic=feedbackRoot.querySelector('[data-feedback-mic]'),copy=feedbackRoot.querySelector('#feedback-copy'),send=feedbackRoot.querySelector('[data-feedback-send]'),status=feedbackRoot.querySelector('#feedback-status');if(mic){mic.textContent=feedbackListening?'듣는 중…':'다시 말하기';mic.setAttribute('aria-pressed',String(feedbackListening))}if(copy){copy.textContent=feedbackDraft||'말한 내용이 여기에 짧게 표시돼요.';copy.classList.toggle('empty',!feedbackDraft)}if(send)send.disabled=feedbackSending||!feedbackDraft.trim()||feedbackDraft.length>10000;if(status)status.textContent=feedbackMessage}
function startFeedbackSpeech(){if(feedbackListening){stopFeedbackSpeech();updateFeedbackView();return}const Recognition=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Recognition){feedbackUnsupported=true;feedbackMessage='음성인식이 지원되지 않아 짧은 입력창을 열었어요.';renderFeedback();feedbackRoot.querySelector('#feedback-fallback')?.focus();return}feedbackMessage='';const recognition=new Recognition();feedbackRecognition=recognition;recognition.lang='ko-KR';recognition.interimResults=true;recognition.continuous=false;recognition.onstart=()=>{feedbackListening=true;feedbackMessage='말씀을 듣고 있어요.';updateFeedbackView()};recognition.onresult=e=>{let text='';for(let i=0;i<e.results.length;i++)text+=e.results[i][0]?.transcript||'';feedbackDraft=text.trim();updateFeedbackView()};recognition.onerror=()=>{feedbackListening=false;feedbackUnsupported=true;feedbackMessage='마이크를 사용할 수 없어 짧은 입력창을 열었어요.';renderFeedback()};recognition.onend=()=>{feedbackListening=false;feedbackRecognition=null;if(!feedbackMessage&&feedbackDraft)feedbackMessage='내용을 확인한 뒤 보내주세요.';updateFeedbackView()};try{recognition.start()}catch{feedbackUnsupported=true;feedbackMessage='마이크를 시작하지 못해 짧은 입력창을 열었어요.';renderFeedback()}}
function feedbackContext(){if(!feedbackIncludeContext)return null;return{screen:current,plan_id:selected()?.plan_id||null,session_id:data?.active_session?.session_id||null,app_version:'0.1.0-ui14',device_type:matchMedia('(max-width: 640px)').matches?'mobile':'desktop'}}
async function submitFeedback(){if(feedbackSending||!feedbackDraft.trim())return;stopFeedbackSpeech();const args={feedback_text:feedbackDraft.trim(),screen_context:feedbackContext()},signature=JSON.stringify(args);if(!feedbackRequest||feedbackRequest.signature!==signature)feedbackRequest={signature,key:'feedback-'+crypto.randomUUID()};feedbackSending=true;feedbackMessage='피드백을 보내고 있어요…';updateFeedbackView();try{if(parent===window&&!window.openai?.callTool)throw new Error('미리보기에서는 피드백을 저장하지 않아요. 연결된 StudyMeta 카드에서 보내주세요.');const receipt=await callTool('submit_pilot_feedback',{...args,idempotency_key:feedbackRequest.key});if(!receipt?.saved)throw new Error('피드백 저장 결과를 확인하지 못했어요.');feedbackRequest=null;feedbackOpen=false;renderFeedback();live.textContent='피드백을 보냈어요. 고마워요.'}catch(e){feedbackMessage=e.message;updateFeedbackView()}finally{feedbackSending=false;updateFeedbackView()}}

function info(){return btn('← 메인','m01','back')+'<h1 class="title">내 정보</h1><p class="lead">사용자님의 행동과 말에 따른 학습 전략 방식이에요.</p><div class="notice">관찰한 행동, 학습 근거, 현재 상태와 다음 제안은 이 카드 아래 채팅 텍스트로 설명해드려요.</div>'}
function stop(){const context=data?.session_context;if(stopped||context?.session?.status==='completed')return '<div class="notice saved"><strong>학습을 마쳤어요.</strong><br>확인된 학습 기록 '+(context?.record_count??0)+'건'+(context?.pending_event_ids?.length?' · 후보 처리 대기 '+context.pending_event_ids.length+'건':'')+'</div><div class="actions"><button class="ghost" data-review>저장된 기록 정리하기</button>'+btn('메인으로','m01')+'</div>';if(!data?.active_session)return '<div class="notice">진행 중인 학습 세션이 없어요.</div>'+btn('학습 시작','free_study');return '<div class="modal"><p class="eyebrow">학습 중단 / 변경</p><h1 class="title">학습을 어떻게 마칠까요?</h1><p>저장에 성공한 기록은 세션 종료 후에도 남아요.</p><div class="actions"><button class="action" data-review>정리하기</button><button class="danger" data-stop>여기서 중단하기</button></div></div>'}
function materialTree(plan){if(!plan)return '<div class="notice">아직 저장된 Plan이 없어요.</div>';const nodes=plan.nodes||[],domain=nodes.find(n=>n.kind==='domain'),units=nodes.filter(n=>n.kind==='unit').sort((a,b)=>a.order-b.order);const badges=n=>{let out=n.material_origin==='new_material'?'<span class="origin new">새 자료에서 추가</span>':'<span class="origin">기존 시험 범위</span>';if(n.prior_learning!=='none'||n.status!=='not_started')out+='<span class="origin">학습 기록 있음</span><span class="origin memory">기억 여부 재확인</span>';return out};return '<div class="tree"><div class="domain">'+esc(domain?.label||plan.course_title)+'</div><div class="units">'+units.slice(0,8).map(u=>'<section class="unit"><h3>'+esc(u.label)+'</h3>'+nodes.filter(n=>n.parent_node_id===u.node_id&&n.kind==='concept').slice(0,20).sort((a,b)=>a.order-b.order).map(n=>'<div class="node" data-status="'+n.status+'">'+esc(n.label)+'<div class="origin-badges">'+badges(n)+'</div></div>').join('')+'</section>').join('')+'</div><p class="legend">기존 개념 · 학습 기록 있음 · 기억 여부 재확인 · 새 개념</p></div>'}
function sourceList(p,updated=false){const materials=p?.materials||[];const base=materials.length?'':('<div class="source-item"><span class="source-tag">기존 범위</span><span class="source-copy"><strong>'+esc(p?.course_title||'현재 Plan')+'</strong><small>'+esc(p?.scope_text||'시험 범위')+'</small></span></div>');const saved=materials.map((m,i)=>{const isNew=updated&&i===materials.length-1;return '<div class="source-item '+(isNew?'new':'')+'"><span class="source-tag">'+(isNew?'새 자료':'기존 자료')+'</span><span class="source-copy"><strong>'+esc(m.material_label)+'</strong><small>'+esc(m.source_summary)+'</small></span></div>'}).join('');const pending=updated?'':'<div class="source-item new"><span class="source-tag">새 자료</span><span class="source-copy"><strong id="material-file-name">'+esc(materialDraft.fileName||'아직 선택하지 않았어요')+'</strong><small>기존 자료와 함께 분석됩니다</small></span></div>';return base+saved+pending}
function material(mode){const p=selected();if(!p)return '<div class="notice">자료를 추가할 Plan을 먼저 선택해주세요.</div>'+btn('Plan 선택','my_plans');if(mode==='material_analyzing')return building().replace('PLAN 생성','자료 통합 분석').replace('단원·개념 분석 요청','새 자료 분석 및 구조 병합');if(mode==='material_updated')return '<p class="eyebrow">시험 범위 갱신</p><h1 class="title">업데이트된 시험 범위</h1><p class="lead">기존 자료와 새 자료를 함께 고려했고, 예전 학습은 현재 기억 여부와 분리했어요.</p><div class="source-list">'+sourceList(p,true)+'</div>'+materialTree(p)+'<div class="actions">'+btn('전체 구조 보기','plan_structure','action')+btn('Plan으로 돌아가기','plan_detail')+'</div>';return btn('← 학습','learning_active','back')+'<h1 class="title">자료 추가</h1><p class="lead">기존 자료와 새 자료를 함께 확인한 뒤 시험 범위를 다시 구성해요.</p><div class="source-list">'+sourceList(p)+'</div><div class="field"><label for="material-file">강의 자료 <span>휴대폰 파일</span></label><input id="material-file" type="file" accept=".pdf,.txt,application/pdf,text/plain"></div><div class="actions"><button class="action wide" type="button" data-start-material>자료 함께 분석하기</button></div>'}
function notes(){const all=plans();return btn('← 메인','m01','back')+'<p class="eyebrow">전체 학습 정리</p><h1 class="title">정리노트</h1><p class="lead">한 Plan이 아니라 지금까지 공부한 전체를 과목·단원·개념별로 정리해요.</p>'+all.map(p=>'<section class="panel" style="margin-bottom:10px"><strong>'+esc(p.course_title)+'</strong><p class="lead">'+esc(p.title)+'</p>'+tree(p,true)+'</section>').join('')+(all.length?'<div class="actions"><button class="action" data-notes-detail>전체 학습 구조와 정리 보기</button></div>':'<div class="notice">아직 정리할 학습 기록이 없어요.</div>')}
function uiSnapshot(){const clean=d=>{const{base64,...safe}=d;return safe};return{modelContent:'현재 StudyMeta 화면: '+current+'; 선택 Plan: '+(selected()?.plan_id||'없음')+'; 활성 세션: '+(data?.active_session?.session_id||'없음')+'; 분석 요청: '+(pendingInput?.request_id||'없음'),privateContent:{screen:current,selectedPlanId:selected()?.plan_id||null,planDraft:clean(planDraft),materialDraft:clean(materialDraft),pendingInput,sessionRequest,freeGoal},imageIds:[]}}
function persistUi(){try{window.openai?.setWidgetState?.(uiSnapshot())}catch{}}
function contextPrompt(requestText){persistUi();return requestText}
function restoreUi(){const saved=window.openai?.widgetState?.privateContent||window.openai?.widgetState;if(!saved||typeof saved!=='object')return;pendingInput=saved.pendingInput||null;sessionRequest=saved.sessionRequest||null;freeGoal=saved.freeGoal||'';if(typeof saved.screen==='string'&&current==='m01')current=saved.screen;if(saved.planDraft&&typeof saved.planDraft==='object')planDraft={...planDraft,...saved.planDraft};if(saved.materialDraft&&typeof saved.materialDraft==='object')materialDraft={...materialDraft,...saved.materialDraft};if(saved.selectedPlanId&&data?.plans){const p=data.plans.find(x=>x.plan_id===saved.selectedPlanId);if(p)data.selected_plan=p}}
async function captureFile(input,draft,labelId){const file=input.files?.[0];if(!file)return;draft.fileName=file.name;draft.base64='';draft.fileStatus='reading';draft.mimeType=file.type==='text/plain'||/\.txt$/i.test(file.name)?'text/plain':file.type==='application/pdf'||/\.pdf$/i.test(file.name)?'application/pdf':'';const label=document.getElementById(labelId);if(label)label.textContent=file.name+' · 읽는 중';try{if(!draft.mimeType)throw new Error('PDF·텍스트 파일을 선택해주세요. 다른 형식은 채팅에 직접 첨부해 분석을 요청할 수 있어요.');if(file.size>3*1024*1024)throw new Error('3MB 이하 파일을 선택해주세요. 큰 자료는 나누거나 채팅에 직접 첨부해주세요.');const bytes=new Uint8Array(await file.arrayBuffer());let binary='';for(let i=0;i<bytes.length;i+=8192)binary+=String.fromCharCode(...bytes.subarray(i,i+8192));draft.base64=btoa(binary);draft.fileStatus='selected';if(label)label.textContent=file.name+' · 선택 완료';live.textContent='파일을 선택했어요. 제출하면 본문을 읽을 수 있는지 확인해요.'}catch(e){draft.fileStatus='failed';if(label)label.textContent=file.name+' · 전달되지 않음';live.textContent=e.message}persistUi()}
async function prepareInput(kind,withMaterial){const d=kind==='plan'?planDraft:materialDraft,p=selected();if(pendingInput){await sendInputRequest();return}if(withMaterial&&(!d.base64||d.fileStatus==='failed'||d.fileStatus==='reading'))throw new Error('읽을 파일을 먼저 선택해주세요. 선택만으로는 자료가 전달되지 않아요.');d.requestId=d.requestId||crypto.randomUUID();const payload={request_id:d.requestId,kind,plan_id:kind==='material'?p?.plan_id||null:planDraft.planId||null,course_title:kind==='material'?p.course_title:planDraft.course,exam_title:kind==='material'?p.exam_title||'':planDraft.examType,exam_date:kind==='material'?p.exam_date:planDraft.date,scope_text:kind==='material'?p.scope_text:planDraft.scope,file:withMaterial?{file_name:d.fileName,mime_type:d.mimeType,base64:d.base64}:null};live.textContent='입력과 자료 본문을 확인하고 있어요…';let receipt;try{receipt=await callTool('prepare_study_input',payload)}catch(error){try{const existing=await callTool('get_study_input_context',{});if(existing?.input){pendingInput={request_id:existing.input.request_id,kind:existing.input.kind};render(pendingInput.kind==='plan'?'plan_building':'material_analyzing')}}catch{}throw error}if(receipt?.status!=='ready')throw new Error('자료 전달 결과를 확인하지 못했어요. 같은 요청으로 다시 시도해주세요.');pendingInput={...receipt,kind};d.fileStatus=withMaterial?'readable':'none';await sendInputRequest()}
async function sendInputRequest(){if(!pendingInput)throw new Error('전달할 분석 요청이 없어요. 입력을 다시 확인해주세요.');render(pendingInput.kind==='plan'?'plan_building':'material_analyzing');const sent=await message(contextPrompt(pendingInput.kind==='plan'?'카드에서 제출한 입력과 자료를 조회해서 StudyMeta Plan을 만들어줘.':'카드에서 제출한 새 자료를 조회해서 선택한 Plan에 추가해줘.'));if(!sent)live.textContent='입력은 보관돼 있어요. 요청 다시 전달을 눌러주세요.'}
async function cancelInput(){if(!pendingInput)return;const kind=pendingInput.kind;await callTool('cancel_study_input',{request_id:pendingInput.request_id});pendingInput=null;const d=kind==='plan'?planDraft:materialDraft;d.requestId='';render(kind==='plan'?'plan_material':'material_add');live.textContent='분석 요청을 취소했어요. 입력 초안은 남겨뒀어요.'}
async function startSession(free=false){const p=selected(),focus=free?[]:[...main.querySelectorAll('[data-focus]:checked')].map(x=>x.dataset.focus);if(!free&&(!p||!focus.length))throw new Error('공부할 개념을 하나 이상 선택해주세요.');const goal=(document.getElementById('session-goal')?.value||freeGoal).trim()||null;const args={plan_id:free?null:p.plan_id,focus_node_ids:focus,session_goal:goal};const signature=JSON.stringify(args);if(!sessionRequest||sessionRequest.signature!==signature)sessionRequest={signature,key:'session-'+crypto.randomUUID()};persistUi();live.textContent='학습 세션을 시작하고 있어요…';const session=await callTool('start_study_session',{...args,idempotency_key:sessionRequest.key});if(!session?.session_id)throw new Error('시작 결과를 확인하지 못했어요. 같은 요청으로 다시 시도해주세요.');sessionRequest=null;if(free)data.selected_plan=null;data.active_session=session;data.review_summary=null;data.session_context={session,plan:free?null:p,record_count:0,pending_event_ids:[]};stopped=false;render('learning_active');await sendFirstQuestion()}
async function beginReview(){const context=await refreshSession(data?.session_context?.session?.session_id),session=context.session;if(!session)throw new Error('정리할 학습 세션이 없어요.');if(context.record_count===0){live.textContent='이 세션에 저장된 학습 기록이 없어요. 대화에서 기록 저장 실패 여부를 먼저 확인해주세요.';return}evidenceFromActiveReview=session.status==='active';render('review_summary');await message('현재 세션의 저장된 원시 학습 기록을 조회해서 정리하고 저장해줘. 후보 판단 보류를 기록 없음으로 취급하지 말고, 이미 열린 정리 카드는 다시 띄우지 말아줘.')}
async function stopSession(){const session=data?.active_session;if(!session)throw new Error('중단할 활성 학습 세션이 없어요.');const result=await callTool('stop_or_change_study',{session_id:session.session_id,action:'stop'});if(!result?.session_context?.session||result.session_context.session.status!=='completed')throw new Error('종료 결과를 확인하지 못했어요. 같은 요청으로 다시 시도해주세요.');data=result;stopped=true;render('stop_confirm');live.textContent=''}
async function requestFullscreen(){try{if(window.openai?.requestDisplayMode)await window.openai.requestDisplayMode({mode:'fullscreen'});else await request('ui/request-display-mode',{mode:'fullscreen'})}catch{live.textContent='이 환경에서는 현재 크기로 전체 구조를 보여드려요.'}}
function render(screen){current=screen||current;window.__atlasScreen?.(current);const map={free_study:freeStudy,m01:home,my_plans:planList,plan_detail:planDetail,plan_structure:planStructure,plan_input:planInput,plan_date:planDate,plan_material:planMaterial,plan_building:building,learning_scope:scope,learning_active:active,my_info:info,review_summary:()=>review(false,false),review_full:()=>review(true,false),review_evidence:()=>review(false,true),stop_confirm:stop,material_add:()=>material('material_add'),material_analyzing:()=>material('material_analyzing'),material_updated:()=>material('material_updated'),notes};main.innerHTML=(map[current]||home)();wire();if(busy)lock(true);persistUi();size()}
function navigate(next){if(next==='review_full'){reviewFullReturn=current==='review_summary'?'review_summary':'plan_detail';requestFullscreen()}if(next==='plan_structure')requestFullscreen();if(next==='review_evidence')evidenceFromActiveReview=current==='review_summary'&&data?.active_session?.status==='active';render(next);if(next==='my_info')message('내 학습 행동과 근거를 바탕으로 현재 학습 방식과 다음 공부 전략을 알려줘.');if(next==='review_evidence')message('방금 학습 정리의 근거를 학생이 이해하기 쉬운 말로 보여줘.')}
function wire(){
main.querySelector('[data-new-plan]')?.addEventListener('click',()=>{planDraft={planId:'',course:'',scope:'',examType:'중간고사',date:'',fileName:'',fileId:'',mimeType:''};render('plan_input')});
main.querySelectorAll('[data-screen]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.screen)));
main.querySelectorAll('[data-plan]').forEach(el=>el.addEventListener('click',()=>{const p=plans().find(x=>x.plan_id===el.dataset.plan);if(p)data.selected_plan=p;render('plan_detail')}));
main.querySelector('[data-edit-plan]')?.addEventListener('click',()=>{const p=selected();if(!p)return;planDraft={...planDraft,planId:p.plan_id,course:p.course_title,scope:p.scope_text,examType:p.exam_title||'중간고사',date:p.exam_date};render('plan_input')});
main.querySelector('[data-start-session]')?.addEventListener('click',()=>perform(()=>startSession(false)));
main.querySelector('[data-start-free]')?.addEventListener('click',()=>perform(()=>startSession(true)));
main.querySelector('#session-goal')?.addEventListener('input',e=>{freeGoal=e.target.value;persistUi()});
main.querySelector('[data-first-question]')?.addEventListener('click',()=>perform(sendFirstQuestion));
main.querySelector('[data-refresh-session]')?.addEventListener('click',()=>perform(async()=>{await refreshSession();render('learning_active')}));
main.querySelector('[data-update-goal]')?.addEventListener('click',()=>perform(async()=>{const goal=document.getElementById('active-goal').value.trim()||null;const signature=JSON.stringify([data.active_session.session_id,goal]);if(!goalRequest||goalRequest.signature!==signature)goalRequest={signature,key:'goal-'+crypto.randomUUID()};const session=await callTool('update_study_session_goal',{session_id:data.active_session.session_id,session_goal:goal,reason:'학습 카드에서 변경',idempotency_key:goalRequest.key});goalRequest=null;data.active_session=session;data.session_context.session=session;render('learning_active');live.textContent='목표를 변경했어요.'}));
main.querySelector('[data-retry-events]')?.addEventListener('click',()=>perform(async()=>{for(const id of data.session_context.pending_event_ids)await callTool('retry_study_event_processing',{event_id:id});await refreshSession();render('learning_active')}));
main.querySelector('[data-pip]')?.addEventListener('click',()=>perform(async()=>{await window.openai.requestDisplayMode({mode:'pip'})}));
main.querySelector('[data-cancel-input]')?.addEventListener('click',()=>perform(cancelInput));
main.querySelector('[data-resend-input]')?.addEventListener('click',()=>perform(sendInputRequest));
main.querySelectorAll('[data-review]').forEach(el=>el.addEventListener('click',()=>perform(beginReview)));
main.querySelector('[data-stop]')?.addEventListener('click',()=>perform(stopSession));
main.querySelector('[data-continue]')?.addEventListener('click',()=>render('learning_active'));
main.querySelector('[data-notes-detail]')?.addEventListener('click',()=>{requestFullscreen();message('지금까지 공부한 전체 내용을 과목·단원·개념별로 정리해줘.')});
const courseForm=document.getElementById('plan-course-form');if(courseForm)courseForm.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(courseForm);planDraft.course=String(fd.get('course')||'').trim();planDraft.scope=String(fd.get('scope')||'').trim();render('plan_date')});
main.querySelectorAll('[data-exam-type]').forEach(el=>el.addEventListener('click',()=>{planDraft.examType=el.dataset.examType;main.querySelectorAll('[data-exam-type]').forEach(chip=>chip.setAttribute('aria-pressed',String(chip===el)))}));
const dateForm=document.getElementById('plan-date-form');if(dateForm)dateForm.addEventListener('submit',e=>{e.preventDefault();const fd=new FormData(dateForm);planDraft.date=String(fd.get('date')||'');render('plan_material')});
const planFile=document.getElementById('plan-file');if(planFile)planFile.addEventListener('change',()=>perform(()=>captureFile(planFile,planDraft,'plan-file-name')));
main.querySelectorAll('[data-create-plan]').forEach(el=>el.addEventListener('click',()=>perform(()=>prepareInput('plan',el.dataset.createPlan==='with-material'))));
const materialFile=document.getElementById('material-file');if(materialFile)materialFile.addEventListener('change',()=>perform(()=>captureFile(materialFile,materialDraft,'material-file-name')));
main.querySelector('[data-start-material]')?.addEventListener('click',()=>perform(()=>prepareInput('material',true)));
}
function size(){if(parent!==window)parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/size-changed',params:{width:Math.ceil(document.documentElement.scrollWidth),height:Math.ceil(document.documentElement.scrollHeight)}},'*')}
addEventListener('message',e=>{if(e.source!==parent)return;const m=e.data||{};if(m.jsonrpc!=='2.0')return;if(m.method==='ui/notifications/tool-result'){const p=parse(m.params);if(p){data=p;current=p.screen;if(['plan_structure','material_updated'].includes(current)){pendingInput=null;planDraft.requestId='';materialDraft.requestId=''}render(current)}}});
feedbackTrigger.addEventListener('click',openFeedback);
async function init(){const preview=parse(window.__STUDYMETA_PILOT_PREVIEW__);if(preview){data=preview;current=preview.screen}restoreUi();if(window.__WORKBOARD_PREVIEW__||parent===window){render(current);return}try{const result=await request('ui/initialize',{protocolVersion:'2026-01-26',appInfo:{name:'studymeta-pilot-ui',version:'0.1.0'},appCapabilities:{availableDisplayModes:['inline','fullscreen','pip']}});hostCapabilities=result?.hostCapabilities||{};const p=parse(result?.toolResult||result);if(p){data=p;current=p.screen;restoreUi()}parent.postMessage({jsonrpc:'2.0',method:'ui/notifications/initialized',params:{}},'*')}catch{parent.postMessage({jsonrpc:'2.0',method:'notifications/initialized',params:{}},'*')}render(current)}
init();new ResizeObserver(size).observe(document.documentElement);
})();
</script></body></html>
